services:
  moonlight-web:
    image: ghcr.io/spacedouut/moonlight-web-stream-simplified:latest
    container_name: moonlight-web
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "40000-40100:40000-40100/udp"
    environment:
      - WEBRTC_NAT_1TO1_HOST=127.0.0.1
      - WEBRTC_PORT_RANGE=40000:40100
    volumes:
      - moonlight-server:/moonlight-web/server

volumes:
  moonlight-server:
    name: moonlight-server
